<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DK Research Bot · Accuracy and team form</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>

*{box-sizing:border-box}
html,body{margin:0}

.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:16px}

.btnrow{display:flex;flex-wrap:wrap;gap:8px}

button:hover{border-color:var(--accent)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.views button{font-family:var(--display);font-size:19px;letter-spacing:.02em;padding:10px 18px}
.small button{padding:5px 12px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.note{color:var(--muted);font-size:13px;margin:0;max-width:78ch}

th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--chip);position:sticky;top:0}
th.sort{cursor:pointer}
tr:last-child td{border-bottom:0}
.tcard table{min-width:0}
.tcard th,.tcard td{padding:6px 7px}
.tcard .tablewrap{overflow-x:auto}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--chip)}
.w{background:var(--good-bg);color:var(--good)} .l{background:var(--bad-bg);color:var(--bad)}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)} .mut{color:var(--muted)}
.bar{display:inline-block;height:8px;border-radius:4px;background:var(--accent);vertical-align:middle;margin-right:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tcard{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--card)}
.tcard h3{margin:0;font-family:var(--display);font-size:22px;display:flex;justify-content:space-between;align-items:baseline}
.tcard h3 span{font-size:15px;color:var(--muted);font-family:var(--body);font-weight:500}
.glist{display:flex;flex-direction:column;gap:4px;font-size:13px}
.grow{display:flex;justify-content:space-between;gap:8px;align-items:center}
.line{display:inline-flex;gap:6px;align-items:center;border-radius:8px;padding:3px 8px;font-size:13px;margin:2px 4px 2px 0;background:var(--chip)}
.line.in{background:var(--good-bg)} .line.out{background:var(--bad-bg)}
input[type=search]{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);min-width:200px}
.plink{border:0;background:none;padding:0;color:var(--accent);font-weight:700;font-size:inherit;border-radius:4px;text-align:left}
.plink:hover{text-decoration:underline}
.poscards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.big{font-family:var(--display);font-size:42px;line-height:1}
.kpis{display:flex;flex-wrap:wrap;gap:16px}
.kpi{display:flex;flex-direction:column}
.kpi small{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
</style>
</head>
<body>
<div class="wrap">
  <div class="sub"><a href="./" style="color:var(--accent)">Back to the projections board</a></div>
  <header>
    <div>
      <h1>Projection Accuracy and Team Form</h1>
      <div class="sub" id="gen">Loading</div>
    </div>

  </header>
  <div class="btnrow views" id="viewBtns" role="group" aria-label="View"></div>
  <main id="main" class="card" aria-live="polite"></main>
</div>

var LCOLS={NBA:[['minutes','MIN'],['pts','PTS'],['reb','REB'],['ast','AST'],['pra','PRA'],['fg3m','3PM'],['stl','STL'],['blk','BLK'],['tov','TOV']]};
function gdate(d){var t=new Date(d+'T12:00:00');return isNaN(t)?d:t.toLocaleDateString('en-US',t.getFullYear()===new Date().getFullYear()?{month:'short',day:'numeric'}:{month:'short',day:'numeric',year:'numeric'})}
function gameTable(rows){
 var cols=LCOLS[sport];if(!cols){cols=ORDER.NFL.filter(function(k){return rows.some(function(g){return g.s[k]})}).map(function(k){return [k,nm(k)]})}
 var body=rows.map(function(g){return [gdate(g.d),(g.h?'vs ':'@ ')+g.o,pill(g.pf>g.pa,(g.pf>g.pa?'W ':'L ')+g.pf+'-'+g.pa)].concat(cols.map(function(c){var v=g.s[c[0]]||0;return String(sport==='NBA'&&c[0]==='minutes'?Math.round(v):v)}))});
 var avg=['Average','',''].concat(cols.map(function(c){return f1(rows.reduce(function(a,g){return a+(g.s[c[0]]||0)},0)/rows.length)}));
 body.push(avg);
 return table([{h:'Date'},{h:'Opp'},{h:'Result'}].concat(cols.map(function(c){return {h:c[1]}})),body)}
function vDetail(m){var p=selP;
 var back=btn('← Back to all players',false,function(){selP=null;render()});m.appendChild(back);
 m.appendChild(el('h2',null,[p.name+' ',el('span',{'class':'mut'},[p.team+' · '+p.pos])]));
 var lines=el('div');p.rows.sort(function(a,b){return ORDER[sport].indexOf(a.stat)-ORDER[sport].indexOf(b.stat)}).forEach(function(r){lines.appendChild(el('span',{'class':'line '+(r.in_range>=0.6?'in':'out')},[el('b',null,[nm(r.stat)]),f1(r.avg_proj)+' → '+f1(r.avg_actual),el('span',{'class':'mut'},['±'+f1(r.mae)+' · '+r.n+'g · '+pct(r.in_range*100)])]))});
 m.appendChild(lines);
 var box=el('div',{'class':'card','style':'border:0;padding:0'},[el('p',{'class':'note'},['Loading game log'])]);m.appendChild(box);
 needL().then(function(){if(selP!==p||view!=='player')return;box.innerHTML='';
  var D=L&&L.sports&&L.sports[sport]&&L.sports[sport][String(p.id)];
  if(!D){box.appendChild(el('p',{'class':'note'},['No game log is published for this player yet. It appears after the next pipeline run.']));return}
  var nx=D.nx;
  box.appendChild(el('p',{'class':'note'},[nx?('Next game: '+(nx.h?'vs ':'@ ')+nx.o+', '+new Date(nx.d).toLocaleString('en-US',{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})):'No upcoming game is scheduled right now.']));
  box.appendChild(el('h2',null,['Last 5 games']));
  box.appendChild(D.l5.length?gameTable(D.l5):el('p',{'class':'note'},['No recent games.']));
  if(nx){box.appendChild(el('h2',null,['Last 5 against '+nx.o]));
   box.appendChild(D.vs.length?gameTable(D.vs):el('p',{'class':'note'},[p.name+' has not played '+nx.o+' in the games the site keeps.']))}
 })}
function tl(){var T=buildTeams(sport),arr=Object.keys(T.teams).map(function(k){var t=T.teams[k],g=t.W+t.L;return Object.assign({tm:k,g:g,pct:g?t.W/g:0,l5pct:t.l5[0]/Math.max(1,t.l5[0]+t.l5[1])},t)}).filter(function(t){return t.g>0});
 arr.sort(function(a,b){var x=a[sortKey],y=b[sortKey];if(typeof x==='string')return sortDir*x.localeCompare(y);return sortDir*((x==null?-99:x)-(y==null?-99:y))});return arr}
function vTeams(m){var T=buildTeams(sport);m.appendChild(el('h2',null,['Team records']));
 m.appendChild(el('p',{'class':'note'},[T.season+' regular season, from '+T.n+' finished games the site keeps ('+T.span[0]+' to '+T.span[1]+'). Click a column heading to sort. Margin is average points scored minus allowed.']));
 m.appendChild(table([{h:'Team',sort:'tm'},{h:'Record',sort:'pct'},{h:'Win %',sort:'pct'},{h:'Home',sort:'hw'},{h:'Away',sort:'aw'},{h:'Last 5',sort:'l5pct'},{h:'Streak',sort:'streak'},{h:'Margin',sort:'margin'}],tl().map(function(t){return [t.tm,t.W+'-'+t.L,f1(t.pct*100)+'%',t.hw+'-'+t.hl,t.aw+'-'+t.al,t.l5[0]+'-'+t.l5[1],(t.streak>0?'W':'L')+Math.abs(t.streak),t.margin==null?'':sgn(t.margin,1)]}),{sortKey:sortKey,sortDir:sortDir}))}
function vLast5(m){m.appendChild(el('h2',null,['Last 5 games']));m.appendChild(el('p',{'class':'note'},['Each team’s five most recent finished games, newest first.']));
 var g=el('div',{'class':'grid'});tl().sort(function(a,b){return a.tm.localeCompare(b.tm)}).forEach(function(t){var c=el('div',{'class':'tcard'});c.appendChild(el('h3',null,[t.tm,el('span',null,[t.W+'-'+t.L+' · last 5: '+t.l5[0]+'-'+t.l5[1]])]));
  var l=el('div',{'class':'glist'});t.last5.forEach(function(x){l.appendChild(el('div',{'class':'grow'},[el('span',null,[x.d.slice(5)+'  '+(x.ha==='H'?'vs':x.ha==='A'?'@':'n')+' '+x.opp]),pill(x.w,(x.w?'W ':'L ')+x.pf+'-'+x.pa)]))});c.appendChild(l);g.appendChild(c)});m.appendChild(g)}
function vH2H(m){var T=buildTeams(sport),names=Object.keys(T.teams).sort();if(!h2hTeam||names.indexOf(h2hTeam)<0)h2hTeam=names[0];
 m.appendChild(el('h2',null,['Head to head']));m.appendChild(el('p',{'class':'note'},['Pick a team to see its last 5 meetings with every other team (regular season and playoffs). Each pill is one game, newest first, from the picked team’s side.']));
 var bar=el('div',{'class':'btnrow small'});names.forEach(function(n){bar.appendChild(btn(n,n===h2hTeam,function(){h2hTeam=n;render()}))});m.appendChild(bar);
 var t=T.teams[h2hTeam],opps=Object.keys(t.h2h).sort(function(a,b){var x=t.h2h[a],y=t.h2h[b];return (y.w/(y.w+y.l))-(x.w/(x.w+x.l))||a.localeCompare(b)});
 var rows=opps.map(function(o){var h=t.h2h[o],ps=el('span');h.games.forEach(function(g){ps.appendChild(pill(g.w,(g.w?'W ':'L ')+g.pf+'-'+g.pa+' '+(g.ha==='H'?'home':g.ha==='A'?'away':'neutral')+(g.po?' PO':'')));ps.appendChild(document.createTextNode(' '))});return [o,h.w+'-'+h.l,ps]});
 m.appendChild(el('p',{'class':'note'},[h2hTeam+' is '+t.W+'-'+t.L+' this season.']));var tb=table([{h:'Opponent'},{h:'Record'},{h:'Meetings, newest first'}],rows);tb.querySelectorAll('td:last-child').forEach(function(td){td.style.textAlign='left'});m.appendChild(tb)}
var R={stat:vStat,pos:vPos,player:vPlayer,teamacc:vTeamAcc,teams:vTeams,last5:vLast5,h2h:vH2H};
function render(){var sb=document.getElementById('sportBtns');sb.innerHTML='';['NBA','NFL'].forEach(function(s){sb.appendChild(btn(s,sport===s,function(){sport=s;selP=null;teamFilter=null;posFilter='All';h2hTeam=null;shown=150;render()}))});
 var vb=document.getElementById('viewBtns');vb.innerHTML='';VIEWS.forEach(function(v){vb.appendChild(btn(v[1],view===v[0],function(){view=v[0];selP=null;teamFilter=null;render();history.replaceState(null,'','#'+v[0])}))});
 var m=document.getElementById('main');m.innerHTML='';R[view](m)}
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&selP){selP=null;render()}});
var hh=location.hash.slice(1);if(R[hh])view=hh;
var bp=fetch('data/board.json?'+Date.now()).then(function(r){return r.json()});
var ap=fetch('data/accuracy.json?'+Date.now()).then(function(r){return r.ok?r.json():null}).catch(function(){return null});
Promise.all([bp,ap]).then(function(x){B=x[0];A=x[1];document.getElementById('gen').textContent='Updated '+new Date(B.generated_at).toLocaleString();render()}).catch(function(){document.getElementById('main').textContent='Could not load the data files. Reload the page to try again.'});
})();
