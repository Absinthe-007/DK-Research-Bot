name: 02 odds snapshot

# Every 2 hours across the hours games are played (15:00-03:59 UTC, i.e. 10 AM to 11 PM EST). A cheap gate job asks
# ESPN whether any game starts within the next 6 hours; if not, nothing else runs and the database is never touched.
# Lines are frozen at tip-off / kickoff, so the last snapshot before the start is the closing line used for CLV.
#
# Credits: The Odds API charges per market per call (3 per sport per run for h2h/spreads/totals), so 7 runs a day is
# about 21 credits per sport on a game day. The run stops at ODDS_API_MIN_REMAINING (default 60). Kalshi and Polymarket
# are free. To poll more often, edit the cron below (a paid key is advisable).
on:
  schedule:
    - cron: "0 15,17,19,21,23,1,3 * * *"
  workflow_dispatch:
    inputs:
      sport:
        type: choice
        options: [both, NBA, NFL]
        default: both
      hours:
        description: "only poll when a game starts within this many hours"
        default: "6"

permissions:
  contents: write

env:
  DATA_TAG: data
  DATABASE_URL: postgresql+asyncpg://dkbot:dkbot@localhost:5432/dkbot
  PGURL: postgresql://dkbot:dkbot@localhost:5432/dkbot
  GH_TOKEN: ${{ github.token }}

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      any: ${{ steps.gate.outputs.any }}
      sports: ${{ steps.gate.outputs.sports }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet httpx pydantic-settings
      - id: gate
        env:
          IN_SPORT: ${{ inputs.sport }}
          IN_HOURS: ${{ inputs.hours }}
        run: |
          if [ "$IN_SPORT" = "NBA" ] || [ "$IN_SPORT" = "NFL" ]; then ARGS="--sport $IN_SPORT"; else ARGS=""; fi
          python -m app.pipeline_v2 gate --hours "${IN_HOURS:-6}" $ARGS

  snapshot:
    needs: gate
    if: needs.gate.outputs.any == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Job-level group so quiet runs (gate = false) never queue behind, or bump, a database writer.
    concurrency:
      group: pipeline
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Start Postgres and restore the database
        id: restore
        run: scripts/ci_db.sh restore
      - name: Snapshot odds and prediction-market prices
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SPORTS: ${{ needs.gate.outputs.sports }}
          IN_HOURS: ${{ inputs.hours }}
        run: |
          for SP in $(echo "$SPORTS" | tr ',' ' '); do
            python -m app.pipeline_v2 odds --sport "$SP" --hours "${IN_HOURS:-6}" || echo "::warning::$SP snapshot failed"
          done
      - name: Adjust projections for injuries / inactives (opt-in)
        # Off unless the repo variable ADJUSTED_PROJECTIONS is "1" (Settings -> Secrets and variables -> Actions -> Variables).
        # Writes adjusted_stat_projections only; the original stat_projections are never touched.
        env:
          ADJUSTED_PROJECTIONS: ${{ vars.ADJUSTED_PROJECTIONS }}
          SPORTS: ${{ needs.gate.outputs.sports }}
        run: |
          for SP in $(echo "$SPORTS" | tr ',' ' '); do
            python -m app.pipeline_v2 adjust --sport "$SP" || echo "::warning::$SP adjust failed"
          done
      - name: Save database to the data release
        if: always() && steps.restore.outcome == 'success'
        run: scripts/ci_db.sh save
